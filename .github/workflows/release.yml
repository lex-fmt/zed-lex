name: Release

# Thin caller of arthur-debert/release/.github/workflows/zed-extension.yml.
#
# All build + bundle + publish logic lives there. This file carries the
# bindings (version input, secrets) and the per-consumer overrides.
#
# Replaces the prior hand-rolled, tag-push-triggered workflow. New
# trigger contract is workflow_dispatch — matching the convention
# used by other release/ stacks (nvim-plugin, tree-sitter, rust-cli).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1 or 1.0.0-rc.1). No leading v.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: arthur-debert/release/.github/workflows/zed-extension.yml@v3
    with:
      version: ${{ inputs.version }}
      # extension-name derives from extension.toml `id` (= "lex"),
      # producing lex-<version>.tar.gz. Override only if convention breaks.
      # extension-name: lex
      # cargo-wasm-name derives from Cargo.toml `name` (= "zed_lex"),
      # producing zed_lex.wasm.
      # cargo-wasm-name: zed_lex.wasm
      submodules: true
    secrets:
      # lex-fmt is cross-org from arthur-debert/release; `inherit`
      # would not propagate. Pass RELEASE_TOKEN explicitly so the
      # bot can push the version-bump commit + tag past the
      # ruleset-protected default branch.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
