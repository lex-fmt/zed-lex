name: CI

# Thin caller of arthur-debert/release/.github/workflows/zed-extension-ci.yml.
#
# All toolchain + cache + invocation logic lives there. This file carries
# the bindings (which extras to install, which umbrella check to run).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: arthur-debert/release/.github/workflows/zed-extension-ci.yml@v1
    with:
      # JS tooling drives parts of the umbrella check (e.g. theme-gen,
      # highlights validators).
      node: true
      # bats is the test runner.
      bats: true
      # app-bin/test-all runs bats files individually (bats 1.10 has a
      # tmpdir race when given a directory). Kept until bin/check-tests
      # handles this upstream.
      check-command: ./app-bin/test-all
      # Submodule `comms` carries shared content.
      submodules: true
      # Match the prior bespoke workflow's cache key so existing
      # cache entries continue to hit.
      cache-shared-key: zed-lex-wasm
